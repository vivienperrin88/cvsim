[project]
name = "qttlind"
version = "2.0.0"
description = "Multilevel tensor-network (quantics) simulation of open bosonic and continuous-variable quantum systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vivien Perrin" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
keywords = ["tensor networks", "quantics", "Lindblad", "open quantum systems", "bosonic codes", "continuous variables", "Gaussian states"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
pandas = ["pandas>=2.1"]

[project.urls]
Paper = "https://arxiv.org/abs/2605.27515"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qttlind = ["py.typed"]

# ----------------------------------------------------------------------------- uv
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.16",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas>=2.1",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "pandas>=2.1",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
bench = [
    "threadpoolctl>=3.5",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-rfE", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "slow: long-running tests (run with --runslow)",
]
filterwarnings = ["error::DeprecationWarning:qttlind.*"]

[tool.coverage.run]
source = ["qttlind"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF", "N"]
ignore = [
    "N802", "N803", "N806",   # physics names: H, L, Psi, N ...
    "B905",                   # zip(strict=...): lengths are validated at the public boundary
    "RUF005",                 # `left + (k,)` reads better than `(*left, k)` for shapes
    "RUF001", "RUF002", "RUF003",  # Greek letters and math symbols in strings/comments
    "E741",                   # 'l' is a bond index
    "RUF007",                 # zip(x[:-1], x[1:]) is explicit about the pairs
    "SIM108",                 # if/else blocks read better than long ternaries in numerical code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N", "B018"]
"docs/conf.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/qttlind"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/qttlind/reference/"]
