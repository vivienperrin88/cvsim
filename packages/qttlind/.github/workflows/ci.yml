name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"      # weekly: slow tests and notebooks

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (exactly the locked versions)
        run: uv sync --locked --no-group notebooks
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov ${{ github.event_name == 'schedule' && '--runslow' || '' }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Test the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl pytest hypothesis pandas
          cd /tmp && /tmp/wheel-env/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -q -p no:cacheprovider

  notebooks:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/run_notebooks.py
